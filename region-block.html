<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Not available in your region — Baccarat Gladiator</title>
<style>
  :root { --gold:#d4af37; --gold-dim:#b8962e; --bg:#0b0d10; --panel:#13171c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #1a1f27 0%, var(--bg) 60%);
    color:#e7e9ec; min-height:100%;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card {
    max-width:520px; width:100%; text-align:center;
    background:var(--panel); border:1px solid rgba(212,175,55,.25);
    border-radius:16px; padding:48px 32px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .crest { font-size:54px; line-height:1; margin-bottom:18px; }
  h1 { font-size:24px; font-weight:700; color:var(--gold); letter-spacing:.3px; margin-bottom:14px; }
  p { font-size:16px; line-height:1.6; color:#b9bec6; margin-bottom:14px; }
  .hint { font-size:13px; color:#7d838c; margin-top:26px; }
  .rule { height:1px; width:60px; margin:22px auto; background:linear-gradient(90deg,transparent,var(--gold-dim),transparent); }
  .brand { font-size:13px; letter-spacing:2px; text-transform:uppercase; color:var(--gold-dim); margin-bottom:6px; }
</style>
</head>
<body>
  <main class="card">
    <div class="crest">⚔️</div>
    <div class="brand">Baccarat Gladiator</div>
    <div class="rule"></div>
    <h1>Not available in your region</h1>
    <p>Baccarat Gladiator is currently available only to visitors in the United States.</p>
    <p>We're working on expanding access. Please check back soon.</p>
    <p class="hint">If you believe you're seeing this in error, try disabling any VPN or proxy and reload.</p>
  </main>
</body>
</html>
