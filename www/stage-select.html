<style>

/* ── Bespoke easing tokens (single source of truth) ─────────────── */
:root {
  --ease-out-back:   cubic-bezier(0.34, 1.30, 0.64, 1);
  --ease-spring:     cubic-bezier(0.5,  1.6,  0.4, 1);
  --ease-anticipate: cubic-bezier(0.7, -0.4, 0.4, 1);
  --ease-pop:        cubic-bezier(0.16, 1,    0.3, 1);
  --ease-press:      cubic-bezier(0.5,  0.05, 0.4, 1.4);
}
#sprite-defs { position:absolute; width:0; height:0; overflow:hidden; }
#particle-fx { position:fixed; inset:0; z-index:35; pointer-events:none; }
#marquee .pre .ico { width:11px; height:11px; color:#ff6cfa;
  filter:drop-shadow(0 0 4px #ff48d8); vertical-align:middle; }
#coin-hint .ico { width:11px; height:11px; color:currentColor; vertical-align:middle; }
.arrow .ico { width:22px; height:22px; color:currentColor;
  filter:drop-shadow(0 0 4px rgba(255,200,80,0.4)); }
#btn-home .ico { width:18px; height:18px; color:currentColor; }
.card .lock .icon { width:42px; height:42px; }
.arrow.pressed { animation:arrow-press 320ms var(--ease-press); }
@keyframes arrow-press {
  0%   { transform:translateY(0)    scale(1);    box-shadow:0 4px 0 #4a0820, 0 6px 14px rgba(0,0,0,0.6); }
  18%  { transform:translateY(-1px) scale(0.99); }
  35%  { transform:translateY(5px)  scale(0.96); box-shadow:0 1px 0 #4a0820, 0 2px 6px rgba(0,0,0,0.6); }
  62%  { transform:translateY(-2px) scale(1.04); }
  82%  { transform:translateY(1px)  scale(0.99); }
  100% { transform:translateY(0)    scale(1);    box-shadow:0 4px 0 #4a0820, 0 6px 14px rgba(0,0,0,0.6); }
}
#btn-select.pressed { animation:select-press 460ms var(--ease-press); }
@keyframes select-press {
  0%   { transform:translateY(0)   scale(1);    box-shadow:0 5px 0 #6a3818, 0 7px 18px rgba(255,180,40,0.45); }
  16%  { transform:translateY(-2px) scale(0.99); }
  38%  { transform:translateY(7px)  scale(0.94); box-shadow:0 1px 0 #6a3818, 0 2px 6px rgba(255,180,40,0.4); }
  62%  { transform:translateY(-3px) scale(1.06); }
  82%  { transform:translateY(2px)  scale(0.99); }
  100% { transform:translateY(0)   scale(1);    box-shadow:0 5px 0 #6a3818, 0 7px 18px rgba(255,180,40,0.45); }
}
.tier-pip.just-cleared { animation:pip-pop 700ms var(--ease-spring); }
@keyframes pip-pop {
  0%   { transform:scaleY(1)   scaleX(1); }
  35%  { transform:scaleY(2.4) scaleX(1.18); }
  60%  { transform:scaleY(0.85) scaleX(0.96); }
  85%  { transform:scaleY(1.08) scaleX(1.02); }
  100% { transform:scaleY(1)   scaleX(1); }
}

* { margin:0; padding:0; box-sizing:border-box;
    -webkit-tap-highlight-color:transparent; -webkit-user-select:none;
    user-select:none; -webkit-touch-callout:none; }
html,body {
  width:100%; height:100vh; height:100dvh; overflow:hidden;
  overscroll-behavior:none; -webkit-overflow-scrolling:auto;
  background:#040008;
  color:#f0e3c0;
  font-family:'Orbitron','Inter',-apple-system,sans-serif;
  touch-action:manipulation;
}

/* ── CRT cabinet backdrop ──────────────────────────────────────
   Deep purple haze + soft starfield, with subtle scanlines for the
   arcade-cabinet feel. */
#cabinet-bg { position:fixed; inset:0; z-index:0;
  background:
    radial-gradient(ellipse at 50% 35%, #1a0530 0%, #0a0218 45%, #040008 100%),
    radial-gradient(circle at 20% 80%, rgba(255,40,180,0.08) 0%, transparent 40%),
    radial-gradient(circle at 80% 20%, rgba(80,200,255,0.10) 0%, transparent 45%);
}
#scanlines { position:fixed; inset:0; z-index:50; pointer-events:none;
  background:repeating-linear-gradient(0deg,
    rgba(0,0,0,0)   0px, rgba(0,0,0,0)   2px,
    rgba(0,0,0,0.18) 2px, rgba(0,0,0,0.18) 3px);
  mix-blend-mode:multiply; opacity:0.55; }

/* Subtle drifting star specks behind everything */
#starfield { position:fixed; inset:0; z-index:1; pointer-events:none;
  background-image:
    radial-gradient(1px 1px at 12% 14%, rgba(255,210,255,0.6), transparent),
    radial-gradient(1px 1px at 24% 70%, rgba(180,220,255,0.5), transparent),
    radial-gradient(1px 1px at 41% 22%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 67% 48%, rgba(255,200,150,0.5), transparent),
    radial-gradient(1px 1px at 82% 78%, rgba(200,180,255,0.5), transparent),
    radial-gradient(1px 1px at 91% 18%, rgba(255,255,255,0.5), transparent);
  animation: stars 80s linear infinite;
}
@keyframes stars { from { background-position:0 0; } to { background-position:0 -200px; } }

/* ── Marquee — chrome/neon header ──────────────────────────── */
#marquee { position:fixed; top:0; left:0; right:0; z-index:20;
  padding:14px 16px max(12px,env(safe-area-inset-top)) 16px;
  padding-top:max(14px,env(safe-area-inset-top));
  text-align:center;
  background:linear-gradient(180deg, rgba(20,4,30,0.92), rgba(20,4,30,0.4) 70%, transparent);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
#marquee .pre { font-family:'Press Start 2P','Orbitron',monospace;
  font-size:0.55rem; letter-spacing:4px; color:#ff6cfa;
  text-shadow:0 0 6px #ff48d8, 0 0 12px #c818a8;
  margin-bottom:6px; }
#marquee .title { font-family:'Cinzel',serif; font-weight:900;
  font-size:1.5rem; letter-spacing:5px;
  background:linear-gradient(180deg, #ffe7a0 0%, #f5c450 35%, #b07f1c 60%, #ffe7a0 80%, #fff5c8 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 6px rgba(255,200,80,0.55));
  text-shadow:0 2px 0 rgba(0,0,0,0.6);
  display:inline-block; padding:0 14px; }
#marquee .sub { font-family:'Orbitron',sans-serif; font-weight:700;
  font-size:0.62rem; letter-spacing:7px; color:#9affe7;
  text-shadow:0 0 4px #4adfd3, 0 0 10px #1a8a85;
  margin-top:4px; animation: pre-blink 1.2s steps(2) infinite; }
@keyframes pre-blink { from { opacity:1; } 50% { opacity:0.65; } to { opacity:1; } }

/* Chrome rail under marquee */
#marquee::after { content:""; display:block; height:2px; margin:14px auto 0; max-width:80%;
  background:linear-gradient(90deg, transparent, #c5b358 12%, #fff5c8 50%, #c5b358 88%, transparent);
  filter:drop-shadow(0 0 4px rgba(255,200,80,0.6)); }

/* ── 3D carousel deck ──────────────────────────────────────── */
#deck-frame { position:fixed; left:50%; top:50%; transform:translate(-50%, -52%);
  width:100%; max-width:600px; height:64vh; max-height:640px;
  perspective:1200px; perspective-origin:50% 50%; z-index:10;
  pointer-events:none; }

#deck { position:absolute; inset:0;
  transform-style:preserve-3d; pointer-events:auto; }

.card { position:absolute; left:50%; top:50%;
  width:78%; aspect-ratio:1200/630;
  transform:translate(-50%, -50%);
  border-radius:14px; overflow:hidden;
  background:#1a0a2a;
  box-shadow:
    0 12px 28px rgba(0,0,0,0.7),
    0 0 0 2px rgba(255,255,255,0.06),
    inset 0 0 0 1px rgba(255,255,255,0.1);
  transition: transform 360ms cubic-bezier(.2,.7,.25,1),
              opacity   360ms ease,
              filter    360ms ease;
  cursor:pointer; }

/* Card art: preview JPG fills, name + tagline overlay */
.card .art { position:absolute; inset:0; background-size:cover; background-position:center;
  background-color:#1a0a2a; }
.card .art-mask { position:absolute; inset:0;
  background:linear-gradient(180deg,
    rgba(0,0,0,0)   0%,
    rgba(0,0,0,0.0) 50%,
    rgba(0,0,0,0.55) 78%,
    rgba(0,0,0,0.85) 100%); }
.card .meta { position:absolute; left:14px; right:14px; bottom:12px;
  text-align:left; }
.card .meta .name { font-family:'Cinzel',serif; font-weight:900;
  font-size:1.15rem; letter-spacing:2px; color:#fff;
  text-shadow:0 2px 6px rgba(0,0,0,0.85); line-height:1.05; }
.card .meta .tag { font-family:'Orbitron',sans-serif; font-weight:500;
  font-size:0.62rem; letter-spacing:1.5px; color:#ffe1a8;
  text-shadow:0 2px 4px rgba(0,0,0,0.85);
  margin-top:3px; }
.card .corner { position:absolute; top:9px; left:9px;
  font-family:'Press Start 2P','Orbitron',monospace; font-size:0.5rem;
  letter-spacing:2px; padding:5px 8px; border-radius:4px;
  background:rgba(0,0,0,0.65); border:1px solid rgba(255,200,80,0.45);
  color:#ffe1a8; text-shadow:0 0 4px rgba(255,200,80,0.6); }
.card .region { position:absolute; top:9px; right:9px;
  font-size:1rem; padding:4px 7px; border-radius:4px;
  background:rgba(0,0,0,0.55); }

/* ── Side-bet badges — abstract typography chips ──────────────
   Frosted-glass chips showing the side-bet code (D7 / P8 / T6) with
   a payout multiplier. No literal animal art — typography only,
   color-coded so players can identify each bonus at a glance. */
.card .sb-badges {
  position:absolute; top:46px; right:9px; z-index:3;
  display:flex; flex-direction:column; gap:6px;
  pointer-events:none;
}
.card .sb-badge {
  min-width:34px; min-height:34px;
  padding:4px 6px;
  border-radius:9px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1px;
  background:rgba(20,10,30,0.55);
  backdrop-filter:blur(8px) saturate(150%);
  -webkit-backdrop-filter:blur(8px) saturate(150%);
  border:1px solid rgba(255,255,255,0.20);
  box-shadow:
    0 3px 8px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(255,255,255,0.22),
    0 0 0 1px var(--sb-tint, rgba(255,255,255,0.10)),
    0 0 12px var(--sb-glow, rgba(255,200,80,0.0));
  position:relative; overflow:hidden;
}
.card .sb-badge::before {
  content:""; position:absolute; inset:0;
  background:linear-gradient(135deg,
    var(--sb-tint, rgba(255,255,255,0.18)) 0%,
    transparent 60%);
  opacity:0.85; pointer-events:none;
}
.card .sb-badge .sb-code {
  position:relative; z-index:1;
  font-family:'Cinzel','Press Start 2P',serif;
  font-weight:900;
  font-size:0.62rem; letter-spacing:1px;
  color:var(--sb-color, #ffe7a0);
  text-shadow:0 1px 2px rgba(0,0,0,0.9),
              0 0 8px var(--sb-glow, rgba(255,200,80,0.6));
  line-height:1;
}
.card .sb-badge .sb-mult {
  position:relative; z-index:1;
  font-family:'Press Start 2P',monospace;
  font-size:0.34rem; letter-spacing:0.5px;
  color:var(--sb-color, #ffe7a0);
  opacity:0.85;
  line-height:1;
}
.card .sb-badge.sb-dragon {
  --sb-tint:rgba(255,90,20,0.34);
  --sb-color:#ffd76e;
  --sb-glow:rgba(255,140,40,0.7);
}
.card .sb-badge.sb-panda {
  --sb-tint:rgba(168,245,208,0.30);
  --sb-color:#ffffff;
  --sb-glow:rgba(168,245,208,0.65);
}
.card .sb-badge.sb-tiger {
  --sb-tint:rgba(255,170,26,0.34);
  --sb-color:#ffe7a0;
  --sb-glow:rgba(255,200,80,0.7);
}
/* Locked stages: dim badges so they don't fight for attention */
.card.locked .sb-badges { opacity:0.55; }

/* Tier-color accent rail across the top of every card */
.card::before { content:""; position:absolute; top:0; left:0; right:0; height:4px;
  background:var(--tier-color, #c5b358);
  box-shadow:0 0 14px var(--tier-color, #c5b358); z-index:2; }

/* Locked card: keep the preview vivid + full-color so the player can see
   the venue and want to unlock it. No grayscale, no big dim curtain.
   Just a small padlock chip over the corner + a tier-requirement strap
   along the meta row. */
.card.locked .art { filter:none; }
.card.locked .art-mask { background:linear-gradient(180deg,
    rgba(0,0,0,0.0) 0%, rgba(0,0,0,0.0) 38%,
    rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.92) 100%); }
.card.locked .meta .name { color:#fff; text-shadow:0 2px 8px rgba(0,0,0,0.95); }
.card .lock { display:none; }
.card.locked .lock { display:flex; position:absolute;
  left:14px; right:14px; top:48px; bottom:auto; z-index:3;
  pointer-events:none; align-items:center; justify-content:center;
  flex-direction:column; gap:6px; }
.card.locked .lock .icon { font-size:2.2rem;
  filter:drop-shadow(0 0 10px rgba(255,180,80,0.7))
         drop-shadow(0 2px 4px rgba(0,0,0,0.85));
  opacity:0.95; }
.card.locked .lock .req { font-family:'Press Start 2P',monospace;
  font-size:0.46rem; letter-spacing:2px; color:#ffc060;
  text-shadow:0 0 4px rgba(255,160,40,0.6), 0 1px 2px rgba(0,0,0,0.95);
  padding:5px 9px; border-radius:3px;
  background:rgba(0,0,0,0.65); border:1px solid rgba(255,180,80,0.5);
  text-align:center; max-width:90%; }
.card.locked.shake { animation:lock-shake 0.45s ease-in-out; }
@keyframes lock-shake {
  0%,100% { transform:translate(-50%, -50%) rotateY(var(--ry,0deg)) translateX(0); }
  20%     { transform:translate(-50%, -50%) rotateY(var(--ry,0deg)) translateX(-8px); }
  40%     { transform:translate(-50%, -50%) rotateY(var(--ry,0deg)) translateX(8px); }
  60%     { transform:translate(-50%, -50%) rotateY(var(--ry,0deg)) translateX(-5px); }
  80%     { transform:translate(-50%, -50%) rotateY(var(--ry,0deg)) translateX(5px); }
}

/* Centered card glows hot */
.card.center {
  filter:drop-shadow(0 0 18px var(--tier-color, #c5b358)); }
.card.center::after { content:""; position:absolute; inset:-3px; border-radius:16px;
  border:2px solid var(--tier-color, #c5b358);
  box-shadow:inset 0 0 14px var(--tier-color, #c5b358),
             0 0 18px var(--tier-color, #c5b358);
  opacity:0.85; pointer-events:none; animation:center-pulse 2.4s ease-in-out infinite; }
@keyframes center-pulse {
  0%,100% { opacity:0.55; }
  50%     { opacity:0.95; }
}

/* ── Bottom controls ─────────────────────────────────────── */
#dock { position:fixed; bottom:0; left:0; right:0; z-index:30;
  padding:12px 14px max(14px,env(safe-area-inset-bottom));
  background:linear-gradient(0deg, rgba(20,4,30,0.92), rgba(20,4,30,0.55) 70%, transparent);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }

#tier-bar { display:flex; gap:5px; justify-content:center;
  margin-bottom:10px; flex-wrap:nowrap; padding:0 4px; }
.tier-pip { flex:1; height:5px; max-width:24px; border-radius:2px;
  background:rgba(255,255,255,0.12); transition:background 200ms;
  box-shadow:inset 0 1px 0 rgba(0,0,0,0.4); }
.tier-pip.cleared { background:linear-gradient(90deg, #c5b358, #ffe7a0);
  box-shadow:0 0 6px rgba(255,200,80,0.7); }
.tier-pip.current { background:linear-gradient(90deg, #ff6cfa, #c818a8);
  box-shadow:0 0 8px rgba(255,108,250,0.9); }

#stage-meta { text-align:center; margin-bottom:10px; }
#stage-meta .num { font-family:'Press Start 2P',monospace; font-size:0.55rem;
  letter-spacing:3px; color:#9affe7; text-shadow:0 0 4px #4adfd3; }
#stage-meta .tier-name { font-family:'Cinzel',serif; font-weight:700;
  font-size:0.78rem; letter-spacing:4px; color:#ffe1a8;
  text-shadow:0 0 6px rgba(255,200,80,0.5);
  margin-top:3px; }

#controls { display:flex; align-items:center; gap:10px; }
.arrow {
  flex:0 0 56px; height:56px; border-radius:14px;
  background:linear-gradient(180deg, #2a0d40 0%, #1a0220 100%);
  border:2px solid rgba(255,200,80,0.45);
  color:#ffe1a8; font-size:1.5rem;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; touch-action:manipulation;
  box-shadow:
    0 4px 0 #4a0820,
    0 6px 14px rgba(0,0,0,0.6),
    inset 0 1px 0 rgba(255,255,255,0.15);
  transition:transform 60ms ease, box-shadow 60ms ease; }
.arrow:active { transform:translateY(3px);
  box-shadow:0 1px 0 #4a0820, 0 2px 6px rgba(0,0,0,0.5),
             inset 0 1px 0 rgba(255,255,255,0.15); }

#btn-select {
  flex:1; height:62px; border-radius:14px; border:none;
  background:
    linear-gradient(180deg, #fff5c8 0%, #ffd75a 30%, #d8a430 60%, #8a6418 100%);
  color:#3a1810; cursor:pointer; touch-action:manipulation;
  font-family:'Cinzel',serif; font-weight:900; letter-spacing:6px;
  font-size:1.05rem;
  text-shadow:0 1px 0 rgba(255,255,255,0.4);
  box-shadow:
    0 5px 0 #6a3818,
    0 7px 18px rgba(255,180,40,0.45),
    inset 0 1px 0 rgba(255,255,255,0.6),
    inset 0 -2px 0 rgba(0,0,0,0.25);
  transition:transform 80ms ease, box-shadow 80ms ease, filter 200ms ease;
  position:relative; overflow:hidden; }
#btn-select::after { content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 50%);
  pointer-events:none; }
#btn-select:active { transform:translateY(4px);
  box-shadow:0 1px 0 #6a3818, 0 3px 8px rgba(255,180,40,0.4),
             inset 0 1px 0 rgba(255,255,255,0.6), inset 0 -2px 0 rgba(0,0,0,0.25); }
#btn-select.locked { filter:grayscale(0.65) brightness(0.55); cursor:not-allowed; }
#btn-select { animation: select-pulse 1.6s ease-in-out infinite; }
@keyframes select-pulse {
  0%,100% { filter:brightness(1); }
  50%     { filter:brightness(1.15) drop-shadow(0 0 12px rgba(255,200,80,0.7)); }
}
#btn-select.locked { animation:none; }

/* "Insert coin" hint that fades after first interaction */
#coin-hint { position:fixed; left:50%; bottom:calc(120px + env(safe-area-inset-bottom));
  transform:translateX(-50%); z-index:25; pointer-events:none;
  font-family:'Press Start 2P',monospace; font-size:0.55rem; letter-spacing:3px;
  color:#ffe1a8; text-shadow:0 0 6px rgba(255,200,80,0.6);
  animation: pre-blink 0.9s steps(2) infinite; opacity:0.92;
  transition:opacity 600ms ease; }
#coin-hint.gone { opacity:0; }

/* Card flash on SELECT */
#flash { position:fixed; inset:0; z-index:60; pointer-events:none;
  background:radial-gradient(circle at 50% 50%, #fff 0%, #ffd75a 30%, transparent 60%);
  opacity:0; transition:opacity 200ms ease; }
#flash.fire { animation: flash-burst 750ms ease-out forwards; }
@keyframes flash-burst {
  0%   { opacity:0; }
  20%  { opacity:1; }
  100% { opacity:0; }
}

/* Loading splash that briefly shows the chosen stage's name before nav */
#load-splash { position:fixed; inset:0; z-index:70; pointer-events:none;
  background:#040008; display:flex; align-items:center; justify-content:center;
  flex-direction:column; opacity:0; transition:opacity 200ms ease; }
#load-splash.show { opacity:1; pointer-events:auto; }
#load-splash .stage-name { font-family:'Cinzel',serif; font-weight:900;
  font-size:2rem; letter-spacing:6px; color:#ffe1a8;
  text-shadow:0 0 16px rgba(255,200,80,0.85); }
#load-splash .stage-tier { font-family:'Press Start 2P',monospace;
  font-size:0.65rem; letter-spacing:4px; color:#9affe7;
  text-shadow:0 0 8px rgba(74,223,211,0.6); margin-top:14px; }
#load-splash .bar { margin-top:24px; width:60%; max-width:300px; height:5px;
  border-radius:2px; background:rgba(255,255,255,0.1);
  overflow:hidden; position:relative; }
#load-splash .bar::after { content:""; position:absolute; inset:0;
  background:linear-gradient(90deg, #ff6cfa, #ffe7a0);

/* iOS short-screen tweak */

// ── Merge extended + active seasonal stages ─────────────────────
// The extended set lives in themes-extended.js (loaded above) and
// is appended here, then the whole roster is sorted by tier so the
// carousel reads T1 → T10 → T11(seasonal). Stable sort preserves
// the hand-curated intra-tier order from both sources.
(function mergeExtendedStages(){
  const ext = window.BG_THEMES_EXTENDED;
  if (!ext) return; // graceful no-op if module failed to load
  STAGES.push.apply(STAGES, ext.STAGES);
  STAGES.push.apply(STAGES, ext.getActiveSeasonalStages());
  STAGES.sort(function(a,b){ return (a.tier||0) - (b.tier||0); });
})();

// ── Persistence ────────────────────────────────────────────────
const LS_VISITED  = 'bg_visited_slugs';
const LS_CLEARED  = 'bg_cleared_tiers';
function loadSet(key) {
  try { return new Set(JSON.parse(localStorage.getItem(key) || '[]')); }
  catch (e) { return new Set(); }
}
function saveSet(key, set) {
  try { localStorage.setItem(key, JSON.stringify([...set])); } catch (e) {}
}
const visited = loadSet(LS_VISITED);
const cleared = loadSet(LS_CLEARED);

function isTierUnlocked(t) {
  // Tier 1: always playable. Tier N (N>1): requires clearing any stage
  // in tier N-1. Clearing = clicking SELECT on that stage at least once.
  if (t === 1) return true;
  return cleared.has(t - 1);
}

// ── Audio (Web Audio API blips) ──────────────────────────────
let audio = null;
function ensureAudio() {
  if (!audio) {
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audio = null; }
  }
}
function blip(freq = 440, dur = 0.06, type = 'square', vol = 0.06) {
  ensureAudio();
  if (!audio) return;
  if (audio.state === 'suspended') audio.resume();
  const o = audio.createOscillator();
  const g = audio.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.value = vol;
  g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
  o.connect(g); g.connect(audio.destination);
  o.start();
  o.stop(audio.currentTime + dur);
}
function selectChunk() {
  // Two-blip "ka-CHUNK" arcade select sound
  blip(660, 0.05, 'square', 0.08);
  setTimeout(() => blip(220, 0.12, 'square', 0.10), 60);
  setTimeout(() => blip(140, 0.18, 'sawtooth', 0.08), 140);
}
function lockedBuzz() {
  blip(110, 0.18, 'sawtooth', 0.12);
}
function navBlip() { blip(540, 0.04, 'square', 0.04); }

// ── Build deck ────────────────────────────────────────────────
const deck = document.getElementById('deck');
let idx = 0;

STAGES.forEach((s, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.slug = s.slug;
  card.dataset.tier = s.tier;
  const tier = TIERS[s.tier - 1];
  card.style.setProperty('--tier-color', tier.color);
  // Extended/seasonal stages have no preview JPG yet — fall back to the
  // theme's signature gradient so the carousel never shows a broken image.
  // Original 60 stages keep their bespoke /preview-<slug>.jpg.
  const artStyle = s.bgGradient
    ? `background:${s.bgGradient}`
    : `background-image:url('/preview-${s.slug}.jpg')`;
  // Corner label: numbered tier for normal stages, "SEASONAL" for T11.
  const cornerLabel = s.seasonal
    ? `SEASONAL · ${String(i+1).padStart(2,'0')}/${STAGES.length}`
    : `T${String(s.tier).padStart(2,'0')} · ${String(i+1).padStart(2,'0')}/${STAGES.length}`;
  card.innerHTML = `
    <div class="art" style="${artStyle}"></div>
    <div class="art-mask"></div>
    <div class="corner">${cornerLabel}</div>
    <div class="region">${s.region}</div>
    <div class="sb-badges" aria-label="Side bets supported">
      <div class="sb-badge sb-dragon" title="Dragon 7 · 40 to 1">
        <span class="sb-code">D7</span>
        <span class="sb-mult">40×</span>
      </div>
      <div class="sb-badge sb-panda" title="Panda 8 · 25 to 1">
        <span class="sb-code">P8</span>
        <span class="sb-mult">25×</span>
      </div>
      <div class="sb-badge sb-tiger" title="Tiger 6 · 50 to 1">
        <span class="sb-code">T6</span>
        <span class="sb-mult">50×</span>
      </div>
    </div>
    <div class="visited-badge">CLEARED</div>
    <div class="meta">
      <div class="name">${s.name}</div>
      <div class="tag">${s.tag}</div>
    </div>
    <div class="lock">
      <svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg>
      <div class="req">${tier.subtitle.toUpperCase()}</div>
    </div>
  `;
  card.addEventListener('click', () => {
    if (i !== idx) { goto(i); return; }
    select();
  });
  deck.appendChild(card);
});

// Find the first stage that's unlocked but not yet visited; that's the
// "next play" target. If everything's cleared, default to last cleared.
// Seasonals (tier 11) are excluded from this default so the carousel
// opens on the natural progression spine, not a holiday card.
const firstUncleared = STAGES.findIndex(s => !s.seasonal && isTierUnlocked(s.tier) && !visited.has(s.slug));
if (firstUncleared >= 0) idx = firstUncleared;

// ── Layout the carousel ───────────────────────────────────────
function layout() {
  STAGES.forEach((s, i) => {
    const card = deck.children[i];
    const tier = TIERS[s.tier - 1];
    const offset = i - idx;
    const isCenter = offset === 0;
    // Seasonals bypass the tier ladder — always rendered unlocked
    // while their date window is open.
    const unlocked = s.seasonal || isTierUnlocked(s.tier);

    card.classList.toggle('center', isCenter);
    card.classList.toggle('locked', !unlocked);
    card.classList.toggle('visited', visited.has(s.slug));

    if (Math.abs(offset) > 4) {
      card.style.display = 'none';
      return;
    }
    card.style.display = 'block';

    const dx = offset * 64;             // % horizontal spread
    const dz = -Math.abs(offset) * 180; // depth
    const ry = offset * -22;            // rotateY
    const op = Math.max(0, 1 - Math.abs(offset) * 0.30);
    card.style.setProperty('--ry', ry + 'deg');
    card.style.transform =
      `translate(-50%, -50%) translate3d(${dx}%, 0, ${dz}px) rotateY(${ry}deg)`;
    card.style.opacity = op;
    card.style.zIndex = 100 - Math.abs(offset);
  });

  // Bottom dock meta
  const stage = STAGES[idx];
  const tier = TIERS[stage.tier - 1];
  document.querySelector('#stage-meta .num').textContent =
    `STAGE ${String(idx + 1).padStart(2, '0')} OF ${String(STAGES.length).padStart(2, '0')}`;
  document.querySelector('#stage-meta .tier-name').textContent =
    `TIER ${stage.tier} · ${tier.name}`;

  // Tier pip bar
  const pips = document.getElementById('tier-bar');
  pips.innerHTML = '';
  for (let t = 1; t <= 10; t++) {
    const pip = document.createElement('div');
    pip.className = 'tier-pip';
    if (cleared.has(t)) pip.classList.add('cleared');
    if (t === stage.tier) pip.classList.add('current');
    pip.title = TIERS[t - 1].name;
    pips.appendChild(pip);
  }

  // SELECT button state — seasonals are always playable while open.
  const btnSel = document.getElementById('btn-select');
  const isUnlocked = stage.seasonal || isTierUnlocked(stage.tier);
  btnSel.classList.toggle('locked', !isUnlocked);
  btnSel.textContent = isUnlocked
    ? (visited.has(stage.slug) ? 'PLAY AGAIN' : (stage.seasonal ? 'PLAY SEASONAL' : 'SELECT STAGE'))
    : 'LOCKED';
}

// ── Navigation ────────────────────────────────────────────────
function goto(i) {
  idx = Math.max(0, Math.min(STAGES.length - 1, i));
  navBlip();
  layout();
  hideHint();
}
function next() { goto(idx + 1); }
function prev() { goto(idx - 1); }

function select() {
  const stage = STAGES[idx];
  // Seasonals bypass the tier ladder — always playable while open.
  if (!stage.seasonal && !isTierUnlocked(stage.tier)) {
    // Locked → shake + buzz
    lockedBuzz();
    const card = deck.children[idx];
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    return;
  }
  // Mark cleared + visited (visiting any stage = clearing its tier).
  // Seasonals don't gate progression so they don't add to `cleared`.
  visited.add(stage.slug);  saveSet(LS_VISITED, visited);
  if (!stage.seasonal) {
    cleared.add(stage.tier);  saveSet(LS_CLEARED, cleared);
  }

  selectChunk();
  document.getElementById('flash').classList.remove('fire');
  void document.getElementById('flash').offsetWidth;
  document.getElementById('flash').classList.add('fire');

  const splash = document.getElementById('load-splash');
  splash.querySelector('.stage-name').textContent = stage.name.toUpperCase();
  splash.querySelector('.stage-tier').textContent = stage.seasonal
    ? 'SEASONAL · LIMITED TIME'
    : `TIER ${stage.tier} · ${TIERS[stage.tier - 1].name}`;
  setTimeout(() => splash.classList.add('show'), 250);

  // Route extended/seasonal stages (those carrying a palette) through
  // the modular themed runner; original 60 keep their bespoke pages.
  const url = stage.palette
    ? `/baccarat-game.html?theme=${encodeURIComponent(stage.slug)}`
    : `/road-to-${stage.slug}.html`;

  setTimeout(() => {
    location.href = url;
  }, 1100);
}

// Swipe gestures on the deck
let touchX = null;
deck.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive:true });
deck.addEventListener('touchend',   e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (dx <  -40) next();
  if (dx >   40) prev();

// ════════════════════════════════════════════════════════════════
//  Particle FX — physics confetti for SELECT and tier unlock.
// ════════════════════════════════════════════════════════════════
class StageSelectFx {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.particles = [];
    this.rafId = null;
    this.lastTs = 0;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this._resize();
    window.addEventListener('resize', () => this._resize());
    this._tick = this._tick.bind(this);
  }
  _resize() {
    const w = window.innerWidth, h = window.innerHeight;
    this.canvas.width  = Math.floor(w * this.dpr);
    this.canvas.height = Math.floor(h * this.dpr);
    this.canvas.style.width  = w + 'px';
    this.canvas.style.height = h + 'px';
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.w = w; this.h = h;
  }
  burst(x, y, palette, count = 60) {
    const colors = palette && palette.length ? palette : ['#ffe1a8'];
    for (let i = 0; i < count; i++) {
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.1;
      const speed = 5 + Math.random() * 9;
      this.particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - (1 + Math.random() * 3),
        gy: 0.32, drag: 0.985,
        rot: Math.random() * Math.PI * 2,
        rotV: (Math.random() - 0.5) * 0.42,
        color: colors[i % colors.length],
        size: 4 + Math.random() * 6,
        life: 1.0, decay: 0.0045 + Math.random() * 0.006,
        shape: Math.random() < 0.55 ? 'rect' : (Math.random() < 0.7 ? 'circle' : 'streak'),
      });
    }
    this._start();
  }
  goldRush(x, y, count = 100) {
    this.burst(x, y, ['#fff5c8', '#ffe7a0', '#f5c450', '#ffd75a', '#c5b358'], count);
  }
  _start() {
    if (this.rafId !== null) return;
    this.lastTs = performance.now();
    this.rafId = requestAnimationFrame(this._tick);
  }
  _tick(ts) {
    const dt = Math.min((ts - this.lastTs) / 16.667, 2.5);
    this.lastTs = ts;
    const ctx = this.ctx;
    const w = this.w, h = this.h;
    ctx.clearRect(0, 0, w, h);
    if (this.particles.length === 0) { this.rafId = null; return; }
    const next = [];
    for (let i = 0; i < this.particles.length; i++) {
      const p = this.particles[i];
      p.vy += p.gy * dt;
      p.vx *= Math.pow(p.drag, dt);
      p.vy *= Math.pow(p.drag, dt);
      p.x  += p.vx * dt;
      p.y  += p.vy * dt;
      p.rot += p.rotV * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0 || p.y > h + 60 || p.x < -60 || p.x > w + 60) continue;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.4));
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') {
        const sw = p.size * 0.6, sh = p.size * 1.2;
        ctx.fillRect(-sw/2, -sh/2, sw, sh);
      } else if (p.shape === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 0.45, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-p.size * 0.18, -p.size * 1.4, p.size * 0.36, p.size * 2.8);
      }
      ctx.restore();
      next.push(p);
    }
    this.particles = next;
    this.rafId = requestAnimationFrame(this._tick);
  }
}
const fx = new StageSelectFx(document.getElementById('particle-fx'));
// Wrap select() to fire confetti from the SELECT button center.
const _origSelect = select;
select = function() {
  const stage = STAGES[idx];
  if (isTierUnlocked(stage.tier)) {
    const wasNewClear = !cleared.has(stage.tier);
    const btn = document.getElementById('btn-select');
    btn.classList.remove('pressed'); void btn.offsetWidth; btn.classList.add('pressed');
    setTimeout(() => btn.classList.remove('pressed'), 480);
    const r = btn.getBoundingClientRect();
    const tier = TIERS[stage.tier - 1];
    fx.burst(r.left + r.width / 2, r.top + r.height / 2,
             [tier.color, '#fff5c8', '#ffe7a0', '#ff6cfa', '#9affe7'], 70);
    if (wasNewClear && stage.tier < 10) {
      setTimeout(() => {
        const pip = document.getElementById('tier-bar').children[stage.tier - 1];
        if (pip) {
          pip.classList.add('just-cleared');
          setTimeout(() => pip.classList.remove('just-cleared'), 720);
        }
        fx.goldRush(window.innerWidth / 2, window.innerHeight * 0.55, 110);
      }, 220);
    }
  } else {
    const card = deck.children[idx];
    const btn = document.getElementById('btn-select');
    btn.classList.remove('pressed'); void btn.offsetWidth; btn.classList.add('pressed');
    setTimeout(() => btn.classList.remove('pressed'), 480);
  }
  _origSelect();
};
// Pulse arrow button on every nav click.
function _pulseArrow(el) {
  if (!el) return;
  el.classList.remove('pressed');
  void el.offsetWidth;
  el.classList.add('pressed');
  setTimeout(() => el.classList.remove('pressed'), 340);
}
document.getElementById('btn-prev').addEventListener('click', e => _pulseArrow(e.currentTarget));
document.getElementById('btn-next').addEventListener('click', e => _pulseArrow(e.currentTarget));
