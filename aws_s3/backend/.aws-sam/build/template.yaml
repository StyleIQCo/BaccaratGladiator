AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Baccarat Gladiator backend (Cognito + validated hand events + global
  leaderboard + monthly tournaments)
Parameters:
  CognitoDomainPrefix:
    Type: String
    Description: Unique Cognito Hosted UI domain prefix
  RedirectUri:
    Type: String
    Default: https://example.com/baccarat-scoreboard.html
    Description: App URL used for Cognito callback/logout
  VisitSalt:
    Type: String
    Default: ''
    NoEcho: true
    Description: Salt used to hash visitor IPs (keeps stored ids non-reversible)
  FeedbackNotifyEmail:
    Type: String
    Default: frankie@styleiq.co
    Description: Address that receives an email for each feedback submission (must
      confirm the SNS subscription email before notifications are delivered)
Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
Resources:
  LeaderboardTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userSub
        AttributeType: S
      - AttributeName: scope
        AttributeType: S
      - AttributeName: topScore
        AttributeType: N
      KeySchema:
      - AttributeName: userSub
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: GlobalScoreIndex
        KeySchema:
        - AttributeName: scope
          KeyType: HASH
        - AttributeName: topScore
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
  TournamentScoresTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: tournamentId
        AttributeType: S
      - AttributeName: userSub
        AttributeType: S
      - AttributeName: finalBalance
        AttributeType: N
      KeySchema:
      - AttributeName: tournamentId
        KeyType: HASH
      - AttributeName: userSub
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: TournamentScoreIndex
        KeySchema:
        - AttributeName: tournamentId
          KeyType: HASH
        - AttributeName: finalBalance
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
  VisitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: visitorId
        AttributeType: S
      - AttributeName: day
        AttributeType: S
      - AttributeName: lastSeen
        AttributeType: S
      KeySchema:
      - AttributeName: visitorId
        KeyType: HASH
      - AttributeName: day
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: ByDay
        KeySchema:
        - AttributeName: day
          KeyType: HASH
        - AttributeName: lastSeen
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
  FeedbackTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: feedbackId
        AttributeType: S
      - AttributeName: day
        AttributeType: S
      - AttributeName: createdAt
        AttributeType: S
      KeySchema:
      - AttributeName: feedbackId
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: ByDay
        KeySchema:
        - AttributeName: day
          KeyType: HASH
        - AttributeName: createdAt
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
  FeedbackTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: BG Feedback
      Subscription:
      - Protocol: email
        Endpoint:
          Ref: FeedbackNotifyEmail
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: BaccaratGladiatorPool
      AutoVerifiedAttributes:
      - email
      Schema:
      - Name: email
        AttributeDataType: String
        Mutable: true
        Required: true
      UsernameConfiguration:
        CaseSensitive: false
      AliasAttributes:
      - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId:
        Ref: UserPool
      ClientName: BaccaratGladiatorWebClient
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_SRP_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
      - implicit
      - code
      AllowedOAuthScopes:
      - openid
      - email
      - profile
      SupportedIdentityProviders:
      - COGNITO
      CallbackURLs:
      - Ref: RedirectUri
      LogoutURLs:
      - Ref: RedirectUri
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain:
        Ref: CognitoDomainPrefix
      UserPoolId:
        Ref: UserPool
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowHeaders:
        - Authorization
        - Content-Type
        AllowMethods:
        - GET
        - POST
        - DELETE
        - OPTIONS
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer:
                Fn::Sub: https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
              - Ref: UserPoolClient
  SubmitHandEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: SubmitHandEventFunction
      Handler: submit_hand_event.handler
      Environment:
        Variables:
          TABLE_NAME:
            Ref: LeaderboardTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: LeaderboardTable
      Events:
        SubmitHandEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /hand-event
            Method: POST
            Auth:
              Authorizer: CognitoJwtAuthorizer
    Metadata:
      SamResourceId: SubmitHandEventFunction
  GetProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetProfileFunction
      Handler: get_profile.handler
      Environment:
        Variables:
          TABLE_NAME:
            Ref: LeaderboardTable
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: LeaderboardTable
      Events:
        GetProfile:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /profile
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
    Metadata:
      SamResourceId: GetProfileFunction
  GetLeaderboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetLeaderboardFunction
      Handler: get_leaderboard.handler
      Environment:
        Variables:
          TABLE_NAME:
            Ref: LeaderboardTable
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: LeaderboardTable
      Events:
        GetLeaderboard:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /leaderboard
            Method: GET
    Metadata:
      SamResourceId: GetLeaderboardFunction
  SubmitTournamentScoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: SubmitTournamentScoreFunction
      Handler: submit_tournament_score.handler
      Environment:
        Variables:
          TOURNAMENT_TABLE:
            Ref: TournamentScoresTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: TournamentScoresTable
      Events:
        SubmitTournamentScore:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /tournament/score
            Method: POST
            Auth:
              Authorizer: CognitoJwtAuthorizer
    Metadata:
      SamResourceId: SubmitTournamentScoreFunction
  GetTournamentLeaderboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetTournamentLeaderboardFunction
      Handler: get_tournament_leaderboard.handler
      Environment:
        Variables:
          TOURNAMENT_TABLE:
            Ref: TournamentScoresTable
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: TournamentScoresTable
      Events:
        GetTournamentLeaderboard:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /tournament/leaderboard
            Method: GET
    Metadata:
      SamResourceId: GetTournamentLeaderboardFunction
  DeleteAccountFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: DeleteAccountFunction
      Handler: delete_account.handler
      Environment:
        Variables:
          TABLE_NAME:
            Ref: LeaderboardTable
          TOURNAMENT_TABLE:
            Ref: TournamentScoresTable
          USER_POOL_ID:
            Ref: UserPool
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: LeaderboardTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: TournamentScoresTable
      - Statement:
        - Effect: Allow
          Action:
          - cognito-idp:AdminDeleteUser
          Resource:
            Fn::GetAtt:
            - UserPool
            - Arn
      Events:
        DeleteAccount:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /account
            Method: DELETE
            Auth:
              Authorizer: CognitoJwtAuthorizer
    Metadata:
      SamResourceId: DeleteAccountFunction
  SubmitFeedbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: SubmitFeedbackFunction
      Handler: submit_feedback.handler
      Environment:
        Variables:
          FEEDBACK_TABLE:
            Ref: FeedbackTable
          FEEDBACK_TOPIC_ARN:
            Ref: FeedbackTopic
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: FeedbackTable
      - SNSPublishMessagePolicy:
          TopicName:
            Fn::GetAtt:
            - FeedbackTopic
            - TopicName
      Events:
        SubmitFeedback:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /feedback
            Method: POST
    Metadata:
      SamResourceId: SubmitFeedbackFunction
  TrackVisitFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: TrackVisitFunction
      Handler: track_visit.handler
      Environment:
        Variables:
          VISITS_TABLE:
            Ref: VisitsTable
          VISIT_SALT:
            Ref: VisitSalt
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: VisitsTable
      Events:
        TrackVisit:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /visit
            Method: POST
    Metadata:
      SamResourceId: TrackVisitFunction
  GetVisitStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetVisitStatsFunction
      Handler: get_visit_stats.handler
      Environment:
        Variables:
          VISITS_TABLE:
            Ref: VisitsTable
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: VisitsTable
      Events:
        GetVisitStats:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /visits/stats
            Method: GET
    Metadata:
      SamResourceId: GetVisitStatsFunction
Outputs:
  ApiBaseUrl:
    Description: HTTP API base URL
    Value:
      Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  CognitoDomain:
    Description: Cognito Hosted UI domain URL
    Value:
      Fn::Sub: https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
  UserPoolId:
    Value:
      Ref: UserPool
  UserPoolClientId:
    Value:
      Ref: UserPoolClient
  TournamentScoresTableName:
    Description: DynamoDB table for monthly tournament scores
    Value:
      Ref: TournamentScoresTable
  FeedbackTableName:
    Description: DynamoDB table for in-game feedback / bug reports
    Value:
      Ref: FeedbackTable
