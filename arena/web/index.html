<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Baccarat Gladiator — Grand Arena</title>
    <!-- Link previews for shared URLs (incl. ?game=… deep links — scrapers
         ignore query params, so this preview covers every arena share). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Baccarat Gladiator — Grand Arena" />
    <meta property="og:description" content="Mini-games and live-table previews: Hotdog Parachute Drop 🌭, boss battles, spectate mode and more. No real-money play." />
    <meta property="og:url" content="https://baccaratgladiator.com/arena/" />
    <meta property="og:image" content="https://baccaratgladiator.com/baccarat-link-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Arena-scoped service worker: owns /arena/ caching, isolated from the root sw.js -->
    <script>
      if ('serviceWorker' in navigator)
        navigator.serviceWorker.register('/arena/sw.js', { scope: '/arena/' }).catch(() => {});
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
